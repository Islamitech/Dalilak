<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pinGold" x1="120" y1="120" x2="390" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="checkEmerald" x1="200" y1="200" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="darkPlate" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="iconGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Background Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="124" fill="url(#darkPlate)" filter="url(#iconGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="124" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- 2. Clean Minimalist Location Pin Ring -->
  <g filter="drop-shadow(0 6px 12px rgba(0,0,0,0.5))">
    <!-- Pin Ring & Point -->
    <path
      d="M256 118 C180 118 126 172 126 248 C126 312 210 376 256 414 C302 376 386 312 386 248 C386 172 332 118 256 118 Z M256 172 C298 172 332 206 332 248 C332 290 298 324 256 324 C214 324 180 290 180 248 C180 206 214 172 256 172 Z"
      fill="url(#pinGold)"
    />

    <!-- Right Side 3D Shade Split for Depth -->
    <path
      d="M256 118 C332 118 386 172 386 248 C386 312 302 376 256 414 L256 324 C298 324 332 290 332 248 C332 206 298 172 256 172 Z"
      fill="#D97706"
      opacity="0.25"
    />
  </g>

  <!-- 3. Bold Crisp Verification Checkmark (White & Emerald) -->
  <g filter="drop-shadow(0 4px 8px rgba(0,0,0,0.4))">
    <!-- Emerald Outline Layer -->
    <path
      d="M208 244 L252 288 L348 160"
      stroke="url(#checkEmerald)"
      stroke-width="36"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Pure Crisp White Core -->
    <path
      d="M208 244 L252 288 L348 160"
      stroke="#FFFFFF"
      stroke-width="20"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>
</svg>